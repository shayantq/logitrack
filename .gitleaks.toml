# پیکربندی gitleaks (اسکن راز در تاریخچه git، مرحله Security scan در CI)
# قواعد پیش‌فرض همه فعال‌اند؛ فقط مقدارهای ساختگی تست که عمداً شبیه رمزند استثنا شده‌اند (نه کل فایل).
[extend]
useDefault = true

[allowlist]
description = "مقدارهای ساختگی تست‌های امنیتی"
# Tmp-Secret-9921: رمز موقت ساختگی تست لاگ؛ GEZDGNBV...: کلید آزمون عمومی RFC 6238 (= "12345678901234567890")
regexes = ['''Tmp-Secret-9921''', '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''']
