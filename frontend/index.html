<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7fbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#091540" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="پسینه" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>پسینه — مدیریت هوشمند ارسال و انبار</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="از انبار تا درِ خانه‌ی مشتری: سفارش، ناوگان، دفتر گردش کالا و پیگیری لحظه‌ای در یک سامانه." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="پسینه" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="پسینه — مدیریت هوشمند ارسال و انبار" />
    <meta property="og:description" content="از انبار تا درِ خانه‌ی مشتری: سفارش، ناوگان، دفتر گردش کالا و پیگیری لحظه‌ای در یک سامانه." />
    <meta property="og:url" content="https://passineh.ir/" />
    <meta property="og:image" content="https://passineh.ir/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // اعمال تم قبل از رندر (بدون چشمک رنگ روشن در حالت تاریک)
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "system";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "light"; }
        // رنگ نوار بالای مرورگر موبایل با تم انتخاب‌شده در سایت (نه فقط تم سیستم)
        var bar = document.documentElement.dataset.theme === "dark" ? "#091540" : "#f7fbfc";
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", bar); m.removeAttribute("media"); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
