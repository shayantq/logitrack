<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4672ad" />
    <title>LogiTrack — مدیریت هوشمند ارسال و انبار</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="از انبار تا درِ خانه‌ی مشتری: سفارش، ناوگان، دفتر گردش کالا و پیگیری لحظه‌ای در یک سامانه." />
    <script>
      // اعمال تم قبل از رندر (بدون چشمک رنگ روشن در حالت تاریک)
      (function () {
        try {
          var pref = localStorage.getItem("theme") || "system";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "light"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
