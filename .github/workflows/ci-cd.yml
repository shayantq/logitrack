# =============================================================================
# خط لوله‌ی ادغام و استقرار مداوم (CI/CD) — سامانه پسینه
#
#   lint ─► test ─────┐
#   frontend ─────────┴─► e2e ─► deploy ─► report
#   security ───────────────────┤
#                    preflight ──┘
#
# - lint:      Ruff روی کد پایتون (خطاهای واقعی، importهای بی‌استفاده، باگ‌های رایج)
# - test:      مایگریشن‌ها (بالا ← برگشت کامل ← بالا) + تطابق مدل‌ها با دیتابیس + pytest با پوشش کد،
#              روی PostgreSQL واقعی
# - frontend:  بررسی TypeScript و build اپ React
# - e2e:       کل استک با Docker Compose + داده نمونه + تست سرتاسری Playwright در Chromium
# - security:  آسیب‌پذیری وابستگی‌ها (pip-audit، npm audit)، تحلیل ایستا (bandit)، راز در تاریخچه git (gitleaks)
#              و آسیب‌پذیری image نهایی (Trivy) — یافته شدید ادغام و استقرار را متوقف می‌کند
# - preflight: فقط push روی main — آیا Secrets سرور تنظیم شده‌اند؟
# - deploy:    به‌روزرسانی سرور با SSH (پشتیبان ← دریافت کد ← build ← بررسی سلامت)
# - report:    جدول نتیجه‌ی همه مراحل در Job Summary همین اجرا
#
# شکست هر مرحله مراحل بعدی را متوقف می‌کند (needs) — کد خراب هرگز به سرور نمی‌رسد.
# تا وقتی Secrets استقرار تنظیم نشده‌اند، deploy با یک پیام توضیحی رد می‌شود (بنگرید README).
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # گام ۱: کیفیت کد پایتون
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # فقط خود ابزار (نه کل وابستگی‌ها) — نسخه هم‌خوان با requirements-dev.txt
      - name: Install Ruff
        run: pip install ruff==0.8.4

      - name: Ruff (errors & style)
        run: ruff check --output-format=github .

  # ---------------------------------------------------------------------------
  # گام ۲: مایگریشن‌ها و تست‌های واحد، API و یکپارچگی روی PostgreSQL واقعی
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logitrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d logitrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # کل زنجیره مایگریشن‌ها روی دیتابیس خالی اجرا، تا ابتدا برگردانده و دوباره اعمال می‌شود؛
      # سپس alembic check تأیید می‌کند مدل‌ها و آخرین مایگریشن دقیقاً یکی‌اند
      - name: Database migrations (upgrade → downgrade → upgrade → check)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/logitrack_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      # تست‌های یکپارچگی (قفل هم‌زمانی SELECT ... FOR UPDATE) روی همین دیتابیس جدا اجرا می‌شوند
      - name: Pytest (unit + API + integration) with coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logitrack_test
        run: pytest -q -rs --junitxml=pytest-report.xml --cov --cov-report=term --cov-report=xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report
          path: |
            pytest-report.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # بیلد فرانت‌اند (TypeScript + Vite) — هم‌زمان با lint/test
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npx vite build

  # ---------------------------------------------------------------------------
  # گام ۳: تست E2E — شبیه‌سازی کاربر واقعی در مرورگر روی کل سیستم
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 90
    env:
      WEB_PORT: 8001
      DB_PORT: 5433
      POSTGRES_PASSWORD: ci-db-password
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v5

      - name: Start full stack (web, worker, beat, PostgreSQL, Redis)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed demo data
        run: docker compose exec -T web python seed_demo_data.py

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E scenarios
        working-directory: tests/ui
        shell: bash
        run: |
          set -o pipefail
          node e2e.mjs http://localhost:${WEB_PORT} 2>&1 | tee e2e.log

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > tests/ui/docker-compose.log

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: |
            tests/ui/e2e.log
            tests/ui/e2e-failure-*.png
            tests/ui/docker-compose.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # اسکن امنیتی — ابزارهای بیرونی فقط با image داکرِ نسخه و digest ثابت اجرا می‌شوند (نه action شخص ثالث)
  # استثناهای مستند و تاریخ‌دار: security/pip-audit-waivers.txt
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python dependencies (pip-audit)
        run: |
          pip install pip-audit==2.7.3 bandit==1.8.0
          ignores=$(grep -vE '^[[:space:]]*(#|$)' security/pip-audit-waivers.txt | sed 's/^/--ignore-vuln /' | xargs)
          pip-audit -r requirements.txt --progress-spinner off $ignores

      - name: Static analysis (bandit, high severity)
        run: bandit -r app -lll -q

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Frontend runtime dependencies (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Secrets in git history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git /repo --redact --no-banner --exit-code 1

      - name: Container image (Trivy)
        run: |
          docker build -t pasineh:scan .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 pasineh:scan

  # ---------------------------------------------------------------------------
  # آیا Secrets لازم برای استقرار تنظیم شده‌اند؟
  # ---------------------------------------------------------------------------
  preflight:
    name: Deploy preflight
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      server_ready: ${{ steps.check.outputs.server_ready }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          server_ready=false
          if [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_PATH" && -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then server_ready=true; fi
          echo "server_ready=$server_ready" >> "$GITHUB_OUTPUT"
          [[ "$server_ready" == true ]] || echo "::notice::Secrets سرور (DEPLOY_*) تنظیم نشده‌اند — مرحله deploy رد می‌شود."

  # ---------------------------------------------------------------------------
  # گام ۴: اتصال امن SSH به سرور و به‌روزرسانی
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [e2e, security, preflight]
    if: needs.preflight.outputs.server_ready == 'true'
    timeout-minutes: 30
    environment:
      name: production
      url: https://passineh.ir
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      # کلید خصوصی فقط در حافظه همین Runner موقت؛ known_hosts از قبل ثبت‌شده (نه ssh-keyscan در لحظه)
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # روی سرور: پشتیبان دیتابیس ← دریافت آخرین نسخه main ← build و اجرای دوباره (مایگریشن‌ها خودکار) ← بررسی سلامت
      - name: Update the server
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          mkdir -p backups
          if docker compose ps --status running --services | grep -qx db; then
            docker compose exec -T db pg_dump -U postgres -d logitrack | gzip > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            ls -1t backups/pre-deploy-*.sql.gz | tail -n +15 | xargs -r rm --
          fi
          git pull --ff-only origin main
          docker compose up -d --build --wait --wait-timeout 300
          docker image prune -f
          port=$(grep -E '^WEB_PORT=' .env 2>/dev/null | cut -d= -f2 | sed 's/.*://' || true)
          curl -fsS "http://localhost:${port:-8001}/health"
          REMOTE

      - name: Sanity check on production domain
        run: curl -fsS --retry 5 --retry-delay 5 https://passineh.ir/health

  # ---------------------------------------------------------------------------
  # گام ۵: گزارش نهایی
  # ---------------------------------------------------------------------------
  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, e2e, security, preflight, deploy]
    if: always()
    steps:
      - name: Summarize
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          FRONTEND: ${{ needs.frontend.result }}
          E2E: ${{ needs.e2e.result }}
          SECURITY: ${{ needs.security.result }}
          DEPLOY: ${{ needs.deploy.result }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }
          overall=success
          for result in "$LINT" "$TEST" "$FRONTEND" "$E2E" "$SECURITY" "$DEPLOY"; do
            if [[ "$result" == failure || "$result" == cancelled ]]; then overall=failure; fi
          done
          {
            echo "## $( [[ $overall == success ]] && echo '✅ خط لوله موفق بود' || echo '❌ خط لوله با شکست مواجه شد')"
            echo ""
            echo "| مرحله | نتیجه |"
            echo "|---|---|"
            echo "| Lint (Ruff) | $(icon "$LINT") $LINT |"
            echo "| Tests (Pytest) | $(icon "$TEST") $TEST |"
            echo "| Frontend build | $(icon "$FRONTEND") $FRONTEND |"
            echo "| E2E (Playwright) | $(icon "$E2E") $E2E |"
            echo "| Security scan | $(icon "$SECURITY") $SECURITY |"
            echo "| Deploy | $(icon "$DEPLOY") $DEPLOY |"
            echo ""
            echo "**برنچ:** \`$BRANCH\` · **Commit:** \`${GITHUB_SHA::7}\` · **توسط:** $ACTOR"
          } >> "$GITHUB_STEP_SUMMARY"

      # خود Report همیشه اجرا می‌شود؛ ولی اگر مرحله‌ای شکست خورده، کل Workflow قرمز بماند
      - name: Fail workflow if any stage failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
