# CI/CD سامانه LogiTrack
#   ۱. backend  — تست‌های pytest (واحد، API و یکپارچگی روی PostgreSQL واقعی)
#   ۲. frontend — بررسی TypeScript و build اپ React
#   ۳. e2e      — کل استک با Docker Compose + داده نمونه + تست سرتاسری Playwright در Chromium
#   ۴. deploy   — فقط push روی main و فقط اگر سرور تنظیم شده باشد (Secrets)؛ به‌روزرسانی سرور با SSH

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logitrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # تست‌های یکپارچگی (قفل هم‌زمانی SELECT ... FOR UPDATE) فقط روی این دیتابیس جدا اجرا می‌شوند
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logitrack_test
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q -rs

  frontend:
    name: Frontend build (TypeScript + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WEB_PORT: 8001
      DB_PORT: 5433
      POSTGRES_PASSWORD: ci-db-password
      SECRET_KEY: ci-only-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (web, worker, beat, PostgreSQL, Redis)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed demo data
        run: docker compose exec -T web python seed_demo_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: tests/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests/ui
        shell: bash
        run: node e2e.mjs http://localhost:${WEB_PORT} 2>&1 | tee e2e.log

      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color --timestamps > tests/ui/docker-compose.log

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/ui/e2e.log
            tests/ui/e2e-failure-*.png
            tests/ui/docker-compose.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to production
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Skip when no server is configured
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret is not set — deployment skipped."

      - name: Configure SSH
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # روی سرور: پشتیبان دیتابیس ← دریافت آخرین نسخه main ← build و اجرای دوباره (مایگریشن‌ها خودکار) ← بررسی سلامت
      - name: Update the server
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          mkdir -p backups
          if docker compose ps --status running --services | grep -qx db; then
            docker compose exec -T db pg_dump -U postgres -d logitrack | gzip > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            ls -1t backups/pre-deploy-*.sql.gz | tail -n +15 | xargs -r rm --
          fi
          git pull --ff-only origin main
          docker compose up -d --build --wait --wait-timeout 300
          docker image prune -f
          port=$(grep -E '^WEB_PORT=' .env 2>/dev/null | cut -d= -f2 || true)
          curl -fsS "http://localhost:${port:-8001}/health"
          REMOTE
